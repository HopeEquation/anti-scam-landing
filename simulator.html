<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!-- 網站 Favicon 圖示 -->
  <link rel="icon" type="image/png" href="img/favicon.png" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>沈浸式體驗｜詐騙情境互動模擬器</title>
<style>
  :root {
    --bg: #f6f8fb;
    --surface: #ffffff;
    --surface-soft: #eaf3fa;
    --text: #17202a;
    --muted: #667085;
    --line: #d9e2ec;
    --primary: #e85d8c;
    --primary-dark: #0a355c;
    --button-primary: #e85d8c;
    --button-primary-dark: #c94a76;
    --accent: #e94f7c;
    --warning: #f6b73c;
    --shadow: 0 20px 50px rgba(22, 34, 51, 0.1);
    --card-shadow: 0 10px 24px rgba(22, 34, 51, 0.06);
    --radius: 8px;
    --max: 680px;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.65;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.8s ease, color 0.8s ease;
  }

  /* 主題環境色切換 */
  body.warmA { --bg: #fdf5f7; --surface-soft: #fde8ef; --primary-dark: #3a1c25; }
  body.warmB { --bg: #f4f7fa; --surface-soft: #e4ecf3; --primary-dark: #0c2d4a; }
  body.warmC { --bg: #faf7f2; --surface-soft: #f4ecdf; --primary-dark: #33281c; }
  body.cold { --bg: #eaf3fa; --surface: #ffffff; --text: #0a355c; --line: #b9d1e8; }
  body.night {
    --bg: #091726;
    --surface: #102336;
    --surface-soft: #162f48;
    --text: #f0f6fc;
    --muted: #8ca4bd;
    --line: #223f5e;
    --primary-dark: #ffffff;
    --card-shadow: 0 14px 30px rgba(0, 0, 0, 0.45);
  }

  /* 頂部毛玻璃導覽列 */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 50;
    border-bottom: 1px solid rgba(217, 226, 236, 0.8);
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(16px) saturate(160%);
    box-shadow: 0 4px 20px rgba(22, 34, 51, 0.04);
  }
  body.night .site-header {
    background: rgba(9, 23, 38, 0.88);
    border-bottom: 1px solid rgba(34, 63, 94, 0.8);
  }
  .header-inner {
    max-width: var(--max);
    margin: 0 auto;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 900;
    color: var(--primary-dark);
  }
  .brand-badge {
    background: var(--surface-soft);
    color: var(--primary);
    font-size: 11px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 999px;
  }
  .header-line-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 999px;
    background: var(--button-primary);
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    text-decoration: none;
    box-shadow: 0 4px 12px rgba(232, 93, 140, 0.25);
    transition: transform 180ms ease, background 180ms ease;
  }
  .header-line-btn:hover {
    background: var(--button-primary-dark);
    transform: translateY(-1px);
  }

  /* 主舞台 Stage */
  #stage {
    width: 100%;
    max-width: var(--max);
    margin: 0 auto;
    padding: 44px 24px 100px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* 頂部場景標籤 */
  .tag {
    display: inline-flex;
    align-items: center;
    align-self: flex-start;
    padding: 5px 14px;
    margin-bottom: 24px;
    border-radius: 999px;
    background: var(--surface-soft);
    color: var(--primary-dark);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.06em;
    min-height: 28px;
  }
  body.night .tag {
    background: var(--surface-soft);
    color: var(--primary);
  }

  /* 內文排版 */
  #text p {
    font-size: 18px;
    line-height: 1.85;
    margin-bottom: 1.15em;
    opacity: 0;
    transform: translateY(8px);
    animation: appear 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  #text p.big {
    font-size: clamp(26px, 4.5vw, 36px);
    line-height: 1.3;
    font-weight: 900;
    color: var(--primary-dark);
    margin-bottom: 0.6em;
  }
  #text p.said {
    padding: 14px 18px;
    border-left: 4px solid var(--primary);
    background: var(--surface);
    border-radius: 0 var(--radius) var(--radius) 0;
    border-top: 1px solid var(--line);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    box-shadow: 0 4px 12px rgba(22, 34, 51, 0.03);
  }
  body.night #text p.said {
    background: var(--surface);
    color: var(--text);
  }
  #text p.mark {
    color: var(--primary);
    font-weight: 800;
  }
  #text p.small {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.7;
  }

  @keyframes appear { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    #text p, .step, .door { animation: none !important; opacity: 1 !important; transform: none !important; }
    body { transition: none; }
  }

  /* 選項容器 */
  #choices {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* 🎯 全域按鈕統一樣式：全面統一為品牌桃紅色，消除任何視覺混淆 */
  button {
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 800;
    line-height: 1.45;
    padding: 16px 20px;
    border-radius: var(--radius);
    border: 1px solid var(--button-primary);
    background: var(--button-primary);
    color: #ffffff;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 10px 24px rgba(232, 93, 140, 0.24);
    transition: all 180ms ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  button:hover {
    background: var(--button-primary-dark);
    border-color: var(--button-primary-dark);
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(232, 93, 140, 0.35);
  }
  button:active {
    transform: scale(0.985);
    box-shadow: 0 6px 14px rgba(232, 93, 140, 0.2);
  }
  button:focus-visible {
    outline: 3px solid rgba(232, 93, 140, 0.4);
    outline-offset: 2px;
  }

  /* 門卡樣式（專屬於主選單的關卡選擇卡） */
  button.door {
    display: block;
    width: 100%;
    text-align: left;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 22px;
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--card-shadow);
    opacity: 0;
    animation: appear 0.45s ease forwards;
  }
  button.door:hover {
    border-color: var(--primary);
    background: #ffffff;
    color: var(--text);
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(22, 34, 51, 0.08);
  }
  button.door span {
    display: block;
    font-size: 18px;
    font-weight: 900;
    color: var(--primary-dark);
  }
  button.door small {
    display: block;
    font-size: 14px;
    color: var(--muted);
    margin-top: 6px;
    font-weight: 500;
  }
  button.door .done {
    display: inline-block;
    color: #fff;
    background: var(--primary);
    font-size: 11px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 999px;
    margin-top: 8px;
  }
  body.night button.door {
    background: var(--surface);
    border-color: var(--line);
    color: var(--text);
  }
  body.night button.door span {
    color: var(--text);
  }

  /* 倒帶步驟卡片 */
  .step {
    border: 1px solid var(--line);
    border-left: 4px solid var(--primary);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 14px;
    background: var(--surface);
    box-shadow: 0 6px 18px rgba(22, 34, 51, 0.04);
    opacity: 0;
    animation: appear 0.45s ease forwards;
  }
  .step h3 {
    font-size: 16px;
    font-weight: 900;
    color: var(--primary-dark);
    margin-bottom: 8px;
  }
  .step p {
    font-size: 15px !important;
    line-height: 1.75 !important;
    margin-bottom: 6px !important;
    color: var(--muted) !important;
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
  .step .hit {
    display: inline-block;
    font-size: 12px;
    font-weight: 800;
    color: #fff;
    background: var(--accent);
    padding: 3px 10px;
    border-radius: 999px;
    margin-top: 8px;
  }

  /* 🎯 結尾專屬 LINE 官方帳號卡片 */
  .line-cta-card {
    margin-top: 36px;
    padding: 26px 24px;
    border: 1.5px solid rgba(232, 93, 140, 0.35);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: 0 14px 34px rgba(22, 34, 51, 0.08);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .line-cta-badge {
    display: inline-flex;
    align-items: center;
    font-size: 12px;
    font-weight: 800;
    color: var(--primary);
    background: var(--surface-soft);
    padding: 4px 12px;
    border-radius: 999px;
  }
  .line-cta-title {
    font-size: 21px;
    font-weight: 900;
    color: var(--primary-dark);
    margin: 0;
  }
  body.night .line-cta-title {
    color: #ffffff;
  }
  .line-cta-desc {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.7;
    margin: 0;
    max-width: 480px;
  }
  .line-cta-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    max-width: 380px;
    margin-top: 8px;
    padding: 16px 22px;
    border-radius: var(--radius);
    background: #06c755; /* LINE 官方代表色 */
    color: #ffffff !important;
    font-size: 16px;
    font-weight: 800;
    text-decoration: none;
    box-shadow: 0 10px 22px rgba(6, 199, 85, 0.28);
    transition: all 180ms ease;
  }
  .line-cta-btn:hover {
    background: #05b04c;
    transform: translateY(-2px);
    box-shadow: 0 14px 28px rgba(6, 199, 85, 0.38);
  }
  .line-cta-btn svg {
    flex-shrink: 0;
  }

  .credit {
    margin-top: 36px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.8;
    text-align: center;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand-title">
      AI 防詐小幫手
      <span class="brand-badge">情境模擬</span>
    </div>
    <a href="https://lin.ee/wIxEnCH" target="_blank" rel="noopener noreferrer" class="header-line-btn">
      加入官方帳號
    </a>
  </div>
</header>

<div id="stage">
  <div class="tag" id="tag"></div>
  <div id="text"></div>
  <div id="choices"></div>
</div>

<script>
(function(){
  const T = document.getElementById('text'), C = document.getElementById('choices'), TAG = document.getElementById('tag');
  let lastResult = '';
  const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let F = {};
  const done = { a: false, b: false, c: false };

  function setBody(cls) { document.body.className = cls || ''; }
  function show(node) {
    T.innerHTML = ''; C.innerHTML = ''; TAG.textContent = node.tag || '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    (node.lines || []).forEach((ln, i) => {
      const p = document.createElement('p');
      if (typeof ln === 'string') { p.textContent = ln; } else { p.textContent = ln.t; if (ln.c) p.className = ln.c; }
      p.style.animationDelay = (i * 0.24) + 's'; T.appendChild(p);
    });
    const delay = rm ? 0 : (((node.lines || []).length * 0.24 + 0.25) * 1000);
    setTimeout(() => {
      (node.choices || []).forEach(ch => {
        const b = document.createElement('button');
        b.textContent = (typeof ch.t === 'function') ? ch.t() : ch.t;
        b.onclick = () => { if (ch.do) ch.do(b); if (ch.next) go(ch.next); };
        C.appendChild(b);
      });
      if (node.render) node.render();
    }, delay);
  }

  const S = {};
  function go(id) { const n = S[id]; if (n.enter) n.enter(); show(n); }

  function doShare(btn) {
    const text = '「善良的重量」三個你以為你不會中的防詐模擬\n' + (lastResult ? ('我剛剛' + lastResult + '\n') : '') + '換你走走看：\n' + location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => {});
    }
    if (btn) btn.textContent = '已複製分享連結';
    if (navigator.share) {
      navigator.share({ title: '善良的重量｜AI 防詐小幫手', text: text }).catch(() => {});
    }
  }

  function addShareCTA(container) {
    const s1 = document.createElement('button');
    s1.textContent = '把這個測驗，傳給你在乎的人';
    s1.onclick = () => doShare(s1);
    container.appendChild(s1);
  }

  /* 🎯 渲染 LINE 官方帳號導流卡片 */
  function renderLineCTA(container) {
    const card = document.createElement('div');
    card.className = 'line-cta-card';
    card.innerHTML = `
      <div class="line-cta-badge">官方認證</div>
      <h3 class="line-cta-title">AI 防詐小幫手．守護你的安全</h3>
      <p class="line-cta-desc">日常對話遇到可疑訊息？隨時把截圖傳給 AI 防詐小幫手，即時為你分析話術與風險等級。</p>
      <a href="https://lin.ee/wIxEnCH" target="_blank" rel="noopener noreferrer" class="line-cta-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.03 2 11c0 3.12 1.77 5.88 4.47 7.42-.2.74-.75 2.76-.86 3.19-.14.54.2.53.42.38.17-.11 2.37-1.61 3.32-2.26.85.18 1.74.27 2.65.27 5.52 0 10-4.03 10-9S17.52 2 12 2z"/></svg>
        立即加入 LINE 官方帳號
      </a>
    `;
    container.appendChild(card);
  }

  /* ============ 開場 ============ */
  S.landing = {
    enter() { setBody(''); },
    lines: [
      { t: '沈浸式體驗', c: 'big' },
      '等一下，你會走進三個局。',
      '一通深夜的求救電話，一次舊識的溫暖問候，一場客氣順利的二手出清。',
      '它們都是真實話術的改編，背後的場景完全不同。',
      '但它們精準鎖定著人性最容易破防的一處裂縫。',
      '你的任務只有一個：',
      { t: '走到最後，守住你的信任與帳戶', c: 'mark' },
      { t: '大部分的人，都覺得自己不可能受騙。', c: 'small' },
      { t: '帶著這份自信走進去的人，往往陷得最深。', c: 'small' }
    ],
    choices: [{ t: '我準備好了，開始體驗', next: 'menu' }]
  };

  /* ============ 選單 ============ */
  S.menu = {
    enter() { setBody(''); F = {}; },
    lines: [
      { t: '三扇門', c: 'big' },
      { t: '選一扇門，走進生活日常裡的真實盲區', c: 'small' }
    ],
    render() {
      const doors = [
        ['a', '深夜的急難來電', '凌晨兩點，熟識之人的聲音在電話那頭焦急哭泣'],
        ['b', '懂你辛苦的舊識', '每天被責任推著走，很久沒人關心你過得累不累'],
        ['c', '過於客氣的買家', '出清一件二手物品，你只想乾脆、順利地完成']
      ];
      doors.forEach((d, i) => {
        const b = document.createElement('button');
        b.className = 'door';
        b.style.animationDelay = (i * 0.12) + 's';
        b.innerHTML = '<span></span><small></small>';
        b.querySelector('span').textContent = d[1];
        b.querySelector('small').textContent = d[2];
        if (done[d[0]]) {
          const s = document.createElement('small');
          s.className = 'done';
          s.textContent = '已完成體驗';
          b.appendChild(s);
        }
        b.onclick = () => go(d[0] + '_intro');
        C.appendChild(b);
      });
      if (done.a || done.b || done.c) {
        const b = document.createElement('button');
        b.style.marginTop = '10px';
        b.textContent = '核心解析：為什麼詐騙的第一步，都是溫度？';
        b.onclick = () => go('finale');
        C.appendChild(b);
        addShareCTA(C);
      }
    },
    choices: []
  };

  /* ============ 局 A：深夜的急難來電 ============ */
  S.a_intro = {
    enter() { setBody('warmA'); F = { rush: 0, verify: 0, hesitate: 0, swiped: null }; },
    lines: [
      { t: '走進這段日常', c: 'big' },
      '心裡想著那個你最在乎、此刻卻不在身邊的人。',
      '可能在異地打拼、在求學，或是同住但今晚因事未歸。',
      '你很關心對方，但平時大家都很忙，日常聯絡總是簡短平淡。',
      '凌晨兩點十七分，手機突然劇烈震動。'
    ],
    choices: [{ t: '接起這通陌生號碼', next: 'a_call' }]
  };
  S.a_call = {
    tag: '凌晨 02:17',
    lines: [
      '電話接通，耳邊傳來急促粗重的呼吸聲與車輛呼嘯的背景音。',
      { t: '「是我⋯⋯你現在旁邊有人嗎？」', c: 'said' },
      '那是你最熟悉的聲音，語氣、換氣停頓都分毫不差。',
      '但那聲音抖得厲害，帶著瀕臨崩潰的哭腔。'
    ],
    choices: [
      { t: '「怎麼了？！你人在哪裡？出什麼事了？」', do: () => F.rush = 1, next: 'a_crisis' },
      { t: '「先冷靜，你原本的手機呢？這誰的號碼？」', do: () => F.verify = 1, next: 'a_doubt' }
    ]
  };
  S.a_doubt = {
    tag: '電話通話中',
    lines: [
      { t: '「我手機撞爛了！這是借路人的電話打的！」', c: 'said' },
      '電話另一頭傳來刺耳的鳴笛聲與嘈雜叫罵聲。',
      { t: '「我現在沒辦法多解釋，事情很嚴重⋯⋯」', c: 'said' },
      '對方的慌亂透過話筒完全傳染給了你。'
    ],
    choices: [{ t: '「好，你慢慢說，到底發生什麼事」', next: 'a_crisis' }]
  };
  S.a_crisis = {
    tag: '電話通話中',
    lines: [
      { t: '「我剛剛在路上擦撞到人，對方的車很貴，人受傷了在叫救護車」', c: 'said' },
      { t: '「對方說半小時內拿出十萬醫藥保證金，簽和解書就不叫警察」', c: 'said' },
      { t: '「不然等警察一來做筆錄、扣車移送，我下週的執照面試就全毀了⋯⋯」', c: 'said' },
      '電話那端傳來一句壓低、極其無助的懇求：',
      { t: '「拜託你，先不要跟家裡其他人講，大家一慌只會把事情鬧大」', c: 'said' },
      { t: '「只有你能幫我了」', c: 'mark' }
    ],
    choices: [
      { t: '打開手機網銀準備轉帳支援', do: () => F.swiped = true, next: 'a_reveal' },
      { t: '「你把電話給旁邊的人，我來跟對方談」', next: 'a_pressure' }
    ]
  };
  S.a_pressure = {
    tag: '電話通話中',

      { t: '「所有要求你『離開平台點外部連結認證』的，全部都是假的。」', c: 'big' },
      '正規交易平台的金流通知，只會存在於官方 APP 內建的系統通知匣內。',
      '當心裡浮現「對方好可憐、好像是我害的」時，請默念這句護身咒：',
      { t: '「對方的帳戶問題只有官方能處理；你只是賣東西的人，不是金流工程師。」', c: 'said' },
      '永遠不要用自己的帳戶安全，去替別人的禮貌與焦慮買單。'
    ],
    choices: [{ t: '完成這局體驗', do: () => done.c = true, next: 'menu' }]
  };

  /* ============ 揭曉與覆盤 ============ */
  function buildReveal(branch, money) {
    const L = [];
    const name = branch === 'a' ? '深夜的急難來電' : branch === 'b' ? '懂你辛苦的舊識' : '過於客氣的買家';
    lastResult = F.swiped ? ('在「' + name + '」被突破了防線（幸好是模擬的）') : ('在「' + name + '」守住了防線，但猶豫過好幾次');
    if (F.swiped) {
      L.push({ t: '你的防線被突破了', c: 'big' });
      L.push('先別急著自責或懊惱。');
      L.push('回頭看看，每一步都是精心對準人性脆弱點的推演。');
      if (F.hesitate > 0) L.push('你其實猶豫過，但每一次猶豫，都有人在旁邊加壓或接住。');
    } else {
      L.push({ t: '你成功守住了防線', c: 'big' });
      L.push('不過先別急著覺得自己天生免疫。');
      if (F.hesitate > 0) L.push('剛剛有幾個瞬間，你差一點就點了下去。');
      L.push('而且你是帶著「這是一場測驗」的防備走進來的。');
      L.push('真實世界裡的局，永遠不會先附上劇本標題。');
    }
    L.push({ t: '我們把剛才的陷阱倒帶一次', c: 'small' });
    const node = S[branch + '_reveal'];
    node.lines = L;
    node.choices = [{ t: '倒帶覆盤這局話術', do: () => setBody('cold'), next: branch + '_steps' }];
  }

  ['a', 'b', 'c'].forEach(br => {
    S[br + '_steps'] = {
      tag: '覆盤倒帶',
      lines: [],
      render() {
        const steps = br === 'a' ? stepsA() : br === 'b' ? stepsB() : stepsC();
        steps.forEach((s, i) => {
          const d = document.createElement('div');
          d.className = 'step';
          d.style.animationDelay = (i * 0.25) + 's';
          d.innerHTML = '<h3></h3><p></p>';
          d.querySelector('h3').textContent = s[0];
          d.querySelector('p').textContent = s[1];
          if (s[2]) {
            const t = document.createElement('span');
            t.className = 'hit';
            t.textContent = '剛剛，這一步踩進了你的心理盲區';
            d.appendChild(t);
          }
          T.appendChild(d);
        });
        const b = document.createElement('button');
        b.textContent = '那要怎麼防守？';
        b.onclick = () => go(br + '_defend');
        C.appendChild(b);
      },
      choices: []
    };
  });

  /* ============ 終章 ============ */
  S.finale = {
    enter() { setBody('cold'); },
    lines: [
      { t: '最後一件事', c: 'big' },
      '走過這三個局，情境完全不同。',
      '親人的急難、舊識的同理、買家的體貼。',
      '但你有沒有發現：',
      { t: '第一步，全部一模一樣', c: 'mark' },
      '急難的局，第一步是那個你最熟悉、讓你掛念的聲音；',
      '舊友的局，第一步是有人讀懂你的疲憊，安靜聽你說話；',
      '交易的局，第一步是有人極度客氣體貼，甚至先跟你道歉。',
      '沒有任何一個局，是從惡意或冷酷開始的。',
      { t: '全部都是從「溫度」開始的', c: 'big' },
      '他們比我們更懂得：人在感到被在乎、感到內疚、或急於保護身邊人時，理智是最脆弱的。'
    ],
    choices: [{ t: '所以，我們該怎麼辦？', do: () => setBody('night'), next: 'ending' }]
  };

/* ============ 終章：單頁完整合併版 ============ */
  S.ending = {
    lines: [
      '防詐從來不是智商的較量，而是「情緒與冷靜時間」的拔河。',
      '當局者迷不是因為愚蠢，而是因為身處其中的人，那一刻滿滿都是人性。',
      '我們需要一個第三方的冷靜角色——',
      { t: '在你心跳加速時，提醒你「掛掉重撥」', c: 'big' },
      { t: '在你感到孤單時，提醒你「先讓專業查證」', c: 'big' },
      { t: '在你滿懷內疚時，提醒你「這不是你的過錯」', c: 'big' },
      '那個角色，可以是願意隨時互通電話、不帶指責的彼此，',
      '也可以是一個客觀冷靜的 AI 防詐小幫手。'
    ],
    render() {
      // 1. 插入「官方認證」LINE 導流卡片
      const card = document.createElement('div');
      card.className = 'line-cta-card';
      card.innerHTML = `
        <div class="line-cta-badge">官方認證</div>
        <h3 class="line-cta-title">AI 防詐小幫手．守護你的安全</h3>
        <p class="line-cta-desc">日常對話遇到可疑訊息？隨時把截圖傳給 AI 防詐小幫手，即時為你分析話術與風險等級。</p>
        <a href="https://lin.ee/wIxEnCH" target="_blank" rel="noopener noreferrer" class="line-cta-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.03 2 11c0 3.12 1.77 5.88 4.47 7.42-.2.74-.75 2.76-.86 3.19-.14.54.2.53.42.38.17-.11 2.37-1.61 3.32-2.26.85.18 1.74.27 2.65.27 5.52 0 10-4.03 10-9S17.52 2 12 2z"/></svg>
          立即加入 LINE 官方帳號
        </a>
      `;
      T.appendChild(card);

      // 2. 插入品牌理念小字 (Credit)
      const cr = document.createElement('div');
      cr.className = 'credit';
      cr.style.margin = '20px 0 32px';
      cr.innerHTML = 'AI 防詐小幫手｜守護每一份良善與信任<br>多一分冷靜查證，少一次不可逆的遺憾';
      T.appendChild(cr);

      // 3. 接續渲染結尾提醒：「多留三分鐘」
      const pTitle = document.createElement('p');
      pTitle.className = 'big';
      pTitle.style.marginTop = '28px';
      pTitle.textContent = '多留三分鐘';
      T.appendChild(pTitle);

      const p1 = document.createElement('p');
      p1.textContent = '遇事掛斷電話、退出外部連結、找官方第三方查證。';
      T.appendChild(p1);

      const p2 = document.createElement('p');
      p2.textContent = '那多出來的三分鐘，比任何悔恨都便宜，也比任何事後補救都有效。';
      T.appendChild(p2);
    },
    choices: [
      {
        t: '回到首頁，體驗其他局',
        next: 'menu'
      },
      {
        t: '把這個測驗，傳給你在乎的人',
        do: (btn) => doShare(btn)
      }
    ]
  };

  go('landing');
})();
</script>
</body>
</html>
